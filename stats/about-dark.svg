<svg xmlns="http://www.w3.org/2000/svg" width="400" height="195" viewBox="0 0 400 195" fill="none" role="img" aria-labelledby="title desc">
<title id="title">About</title>
<desc id="desc">Hi, I&#39;m Skonester Media player and desktop app enthusiast. A soft spot for F# and Paradox. Exploring playback, streaming, and UI ideas. GitHub: @skonester</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #7d8590; letter-spacing: 0.04em; }
  .secondary { fill: #9198a1; }
  .muted { fill: #7d8590; }
  .icon { fill: #9198a1; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="399" height="194" rx="6" fill="none" stroke="#3d444d"/>
<text x="20" y="28" class="col">ABOUT</text>
<g transform="translate(20 66)"><g class="fade" style="animation-delay: 200ms"><text style="font-size: 22px; font-weight: 700;">Hi, I&#39;m <tspan fill="#39c5cf">Skonester</tspan></text></g></g>
<g transform="translate(20 94)"><g class="fade" style="animation-delay: 290ms"><text class="label secondary">Media player and desktop app enthusiast.</text></g></g>
<g transform="translate(20 116)"><g class="fade" style="animation-delay: 380ms"><text class="label secondary">A soft spot for <tspan fill="#39c5cf">F#</tspan> and <tspan fill="#39c5cf">Paradox</tspan>.</text></g></g>
<g transform="translate(20 138)"><g class="fade" style="animation-delay: 470ms"><text class="label secondary">Exploring playback, streaming, and UI ideas.</text></g></g>
<g transform="translate(20 160)"><g class="fade" style="animation-delay: 560ms"><text class="col">GITHUB</text><text x="58" class="label">@skonester</text></g></g>
</svg>
